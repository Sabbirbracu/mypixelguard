[package]
name = "mpg-core"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
fast_image_resize = "6.1.0"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "gif", "bmp"] }
kamadak-exif = "0.6.1"
ndarray = "0.17.2"
ort = "2.0.0-rc.14"
quick-xml = "0.42.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
webp = "0.3.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Graphics_Imaging", "Storage_Streams", "Win32_System_WinRT"] }
