[workspace]
members = ["core", "src-tauri"]
resolver = "2"

[profile.release]
# Image work is CPU-bound: optimise hard, keep the installer small.
opt-level = 3
lto = false
codegen-units = 4
strip = true

[profile.dev.package."*"]
# Dependencies (image codecs, resizer) are painfully slow unoptimised, even in debug builds.
opt-level = 2
