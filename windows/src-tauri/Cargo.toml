[package]
name = "mypixelguard"
version = "1.0.0"
description = "MyPixelGuard — Your Images. Your Privacy. Your Control."
authors = ["Agentiq BD"]
edition = "2024"

[lib]
name = "mypixelguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mpg-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
# Update check, opt-in stats and feedback (see src/services.rs). Uses Windows' own TLS.
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "System_Profile",
    "Storage_Streams",
    "Win32_UI_WindowsAndMessaging",
] }
