# Builds the Windows installer on a real Windows machine (GitHub Actions) and uploads it as MyPixelGuard-windows-setup.exe.
# Run it from the repo's Actions tab ("Build Windows installer" -> Run workflow), then download the artifact.
name: Build Windows installer
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also upload the installer to mypixelguard.agentiqbd.com/downloads"
        type: boolean
        default: true
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: Fetch on-device AI models
        run: python scripts/fetch_models.py
      - run: pnpm install --frozen-lockfile
      - name: Test the core
        run: cargo test --release -p mpg-core
      - name: Build installers
        run: pnpm tauri build
      - name: Name the installer for the website
        shell: bash
        run: |
          mkdir -p ../upload
          cp target/release/bundle/nsis/*.exe ../upload/MyPixelGuard-windows-setup.exe
          cp target/release/bundle/msi/*.msi ../upload/MyPixelGuard-windows.msi
          # the download page shows this fingerprint so people can verify their copy
          (cd ../upload && sha256sum MyPixelGuard-windows-setup.exe | cut -d' ' -f1 > MyPixelGuard-windows-setup.exe.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: MyPixelGuard-windows
          path: upload/*

  # Sends the finished installer to the VPS (same locked key as the landing page: it can only write inside /var/www/mypixelguard).
  publish:
    needs: windows
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MyPixelGuard-windows
          path: installer
      - name: Upload to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ls -lh installer
          rsync -az --chmod=F644 \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            installer/MyPixelGuard-windows-setup.exe installer/MyPixelGuard-windows-setup.exe.sha256 "$DEPLOY_USER@$DEPLOY_HOST:downloads/"
      - name: Check the download
        run: |
          curl -fsSI https://mypixelguard.agentiqbd.com/downloads/MyPixelGuard-windows-setup.exe
          curl -fsS https://mypixelguard.agentiqbd.com/downloads/MyPixelGuard-windows-setup.exe.sha256
