# Builds the Windows installer on a real Windows machine (GitHub Actions) and uploads it as MyPixelGuard-windows-setup.exe.
# Run it from the repo's Actions tab ("Build Windows installer" -> Run workflow), then download the artifact.
name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: Fetch on-device AI models
        run: python scripts/fetch_models.py
      - run: pnpm install --frozen-lockfile
      - name: Test the core
        run: cargo test --release -p mpg-core
      - name: Build installers
        run: pnpm tauri build
      - name: Name the installer for the website
        shell: bash
        run: |
          mkdir -p ../upload
          cp target/release/bundle/nsis/*.exe ../upload/MyPixelGuard-windows-setup.exe
          cp target/release/bundle/msi/*.msi ../upload/MyPixelGuard-windows.msi
      - uses: actions/upload-artifact@v4
        with:
          name: MyPixelGuard-windows
          path: upload/*
