<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyPixelGuard — Your Images. Your Privacy. Your Control.</title>
  <meta name="description" content="MyPixelGuard shows what's hiding inside your photos, removes it, blurs what shouldn't be seen and gets images ready to share. Everything runs on your own computer — nothing is uploaded.">
  <meta name="theme-color" content="#111827">
  <meta property="og:type" content="website">
  <meta property="og:title" content="MyPixelGuard — Your Images. Your Privacy. Your Control.">
  <meta property="og:description" content="Inspect, clean, redact, convert, resize and compress your images — 100% on your device.">
  <meta property="og:url" content="https://mypixelguard.agentiqbd.com/">
  <link rel="canonical" href="https://mypixelguard.agentiqbd.com/">
  <meta property="og:image" content="https://mypixelguard.agentiqbd.com/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="780">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="/favicon-64.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- Runs before first paint: marks the page as JS-enabled (for the scroll reveal) and, for returning Bangla
       visitors, holds the first paint a moment so English never flashes before the language is applied. -->
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add("js");
      try {
        var q = new URLSearchParams(location.search).get("lang");
        var s = q || localStorage.getItem("mpg-lang");
        var bn = s ? s === "bn" : (navigator.language || "").toLowerCase().indexOf("bn") === 0;
        if (bn) { d.classList.add("bn-pending"); setTimeout(function () { d.classList.remove("bn-pending"); }, 2500); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/entry-client.tsx"></script>
</body>
</html>
