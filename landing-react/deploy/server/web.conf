# Inside the mypixelguard-web container. The ERP's nginx is the public door and terminates HTTPS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # redirects such as /download/mac -> /download/mac/ must not carry the internal port 8080
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css text/plain text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Unknown addresses are a real 404 (never the home page again: Google calls that a "soft 404"),
    # and missing files such as /.well-known/ai-catalog.json are 404 too instead of returning HTML.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache" always;
    }

    # the pages themselves: always revalidate, so a new deploy shows up at once
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # hashed build files never change: cache for a year
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # the installers (.dmg / .exe), uploaded separately from the site so deploys never delete them
    location /downloads/ {
        alias /srv/downloads/;
        try_files $uri =404;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=3600" always;
    }
}
