# /etc/nginx/sites-available/mypixelguard  (then: ln -s into sites-enabled, nginx -t, systemctl reload nginx)
# Run `certbot --nginx -d mypixelguard.agentiqbd.com` afterwards: it adds the https server block and the redirect for you.
server {
    listen 80;
    listen [::]:80;
    server_name mypixelguard.agentiqbd.com;

    root /var/www/mypixelguard/site;      # the built landing page (dist/) — replaced on every deploy
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # the page itself: always revalidate, so a new deploy shows up at once
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # hashed build files never change: cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # the installers (Mac .dmg, Windows .exe). Kept outside site/ so deploys never delete them.
    location /downloads/ {
        alias /var/www/mypixelguard/downloads/;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # visitor counter (Node, listens on localhost only)
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        client_max_body_size 4k;
    }
}
